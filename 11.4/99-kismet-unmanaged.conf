# 99-kismet-unmanaged.conf — Hand-Me-Down Homelab, section 11.4.
# Keep NetworkManager's hands off Kismet's capture radio.
# Install in /etc/NetworkManager/conf.d/; change wlan1 to your adapter.
#
# wlan1 is the Alfa AWUS036ACS (Realtek RTL8811AU/8821AU). It is a
# SNIFFER: no IP, state=down, and it must never associate with anything.
# Kismet's linuxwifi datasource creates wlan1mon as a monitor VIF on the SAME
# radio and captures there. All real networking on the author's sensor is wired.
#
# Left managed, NM had wpa_supplicant scanning a down interface every ~3
# minutes, and a scan retunes the shared phy2 radio out from under Kismet's
# monitor hopping. The symptom was CTRL-EVENT-SCAN-FAILED ret=-100 -- ENETDOWN,
# i.e. scanning an interface that is down by design.
#
# HONEST SCOPE NOTE: this was NOT the cause of the 2026-09-05 rtw88 tx-power
# WARNING storm. That was hops to channel 165 (see kismet_site.conf), and
# unmanaging wlan1 changed the warning rate not at all (48/min -> 56/min).
# This file is correct on its own merits -- a dedicated capture adapter should
# not be managed -- not because it fixed that.
#
# Applied at runtime first with `nmcli device set wlan1 managed no`; this file
# makes it survive a reboot. It takes effect at next NM start. Do NOT restart
# NetworkManager over SSH to apply it: if NM also manages the interface your SSH session uses.
[keyfile]
unmanaged-devices=interface-name:wlan1;interface-name:wlan1mon
