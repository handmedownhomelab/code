# NGINX Proxy Manager: serve the ACME challenge on every proxy host.
# Hand-Me-Down Homelab, section 3.3.
#
# Install as data/nginx/custom/server_proxy.conf in NPM's data folder
# (e.g. /srv/npm/data/nginx/custom/server_proxy.conf), then
#   docker exec <npm-container> nginx -t && docker exec <npm-container> nginx -s reload
# NPM includes this file in every proxy host's server block and never rewrites
# it. acme.sh issues with --webroot <npm-data>/letsencrypt-acme-challenge.
# Delete this file and renewals quietly stop.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
    default_type "text/plain";
    root /data/letsencrypt-acme-challenge;
}
