# Export settings for speedcam_export.py
# Deploys to /opt/speed-camera/speedcam.conf

DB_PATH=/opt/speed-camera/data/speed_cam.db
DB_TABLE=speed
CSV_PATH=/var/lib/speedcam/speedcam_traffic.csv
CURSOR_PATH=/var/lib/speedcam/.export_cursor
TIMEZONE=America/New_York   # YOURS: every row is stamped in this zone

# Map speed-cam's camera-relative direction onto compass bearings.
# THIS IS PER DEPLOYMENT. L2R means left-to-right as the camera sees it, so
# turning the unit around inverts it. Get it wrong and every direction in the
# report is backwards - and nothing in the data will look wrong.
# Confirm by walking past the lens and reading the logged direction.
L2R_DIRECTION=east
R2L_DIRECTION=west

# Rows timestamped before this year are treated as "clock was never set" and
# dropped. A portable Pi has no network; without the RTC it boots to epoch.
MIN_VALID_YEAR=2026
