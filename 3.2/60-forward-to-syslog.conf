# Forward all local messages to the central syslog collector.
# Hand-Me-Down Homelab, section 3.2. Install on each Linux host as
# /etc/rsyslog.d/60-forward-to-syslog.conf, set target to YOUR collector's
# address, then: rsyslogd -N1 && systemctl restart rsyslog
#
# Addressed by IP, not by name, deliberately: the logging path must not
# depend on Pi-hole being up, and a DNS outage is exactly the sort of event
# worth having logs for.
#
# TCP rather than UDP -- UDP drops silently, which defeats the point.
# The disk-assisted queue means a collector restart or reboot costs nothing;
# action.resumeRetryCount="-1" retries forever rather than discarding.
#
# This forwards a COPY. Local /var/log and journald are untouched.

*.* action(type="omfwd"
           target="192.168.1.10"     # YOUR collector's IP address
           port="514"
           protocol="tcp"
           queue.type="LinkedList"
           queue.filename="fwd-central"
           queue.maxdiskspace="200m"
           queue.saveonshutdown="on"
           action.resumeRetryCount="-1")
