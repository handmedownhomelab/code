# Central syslog collector for remote hosts.
# Hand-Me-Down Homelab, section 3.2. Install as /etc/rsyslog.d/10-remote-collector.conf
# on the collector, then: rsyslogd -N1 && systemctl restart rsyslog
#
# Messages arriving on 514 are written to a per-host file tree and then
# dropped -- they never reach the default ruleset, so this container's own
# /var/log/syslog stays local-only.

module(load="imudp")
module(load="imtcp" MaxSessions="200")

input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

# /var/log/remote/<host>/<YYYY-MM-DD>.log
# secpath-replace neutralises path separators in a hostile HOSTNAME.
template(name="RemoteFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%$YEAR%-%$MONTH%-%$DAY%.log")

# Sidecar for firewall drop-rule hits -- see the ruleset comment below.
template(name="RemoteFirewallFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%$YEAR%-%$MONTH%-%$DAY%-firewall.log")

template(name="RemoteFormat" type="string"
         string="%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogfacility-text%.%syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Disk-assisted queue: a burst or a slow write does not cost messages,
# and queue.saveonshutdown keeps what is in flight across a restart.
ruleset(name="remote"
        queue.type="LinkedList"
        queue.filename="remoteq"
        queue.maxdiskspace="1g"
        queue.saveonshutdown="on") {

    # Firewall drop-rule hits from a UniFi gateway carry a syslogtag like
    # [CUSTOM1_<zone>-D-<index>]. One chatty device on a blocked VLAN can
    # double the gateway's daily log with them. They're worth keeping (that
    # is what a forensic collector is for) but not in the file you read, so
    # they go to <date>-firewall.log beside it. Matched on $rawmsg, not
    # $syslogtag, so it holds however the sender's tag parses. Delete this
    # block if your gateway isn't UniFi.
    if $rawmsg contains "CUSTOM1_" then {
        action(type="omfile"
               dynaFile="RemoteFirewallFile"
               template="RemoteFormat"
               dirCreateMode="0755"
               fileCreateMode="0640"
               dynaFileCacheSize="50")
        stop
    }

    action(type="omfile"
           dynaFile="RemoteFile"
           template="RemoteFormat"
           dirCreateMode="0755"
           fileCreateMode="0640"
           dynaFileCacheSize="50")
    stop
}
