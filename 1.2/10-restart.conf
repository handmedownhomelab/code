# /etc/systemd/system/mbpfan.service.d/10-restart.conf
# Hand-Me-Down Homelab, section 1.2. install-mbpfan.sh writes this for you.
#
# Once mbpfan has taken over, the fan holds its last commanded speed, so an
# mbpfan that dies while the fan is slow leaves it slow. mbpfan hands control
# back on a clean stop, but not if it's killed or crashes.
#
# After adding it by hand: systemctl daemon-reload && systemctl restart mbpfan
[Service]
Restart=always
RestartSec=5
